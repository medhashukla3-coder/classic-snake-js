<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Retro Snake</title>
  <meta name="description" content="A polished, modern retro-arcade Snake game built with HTML5 Canvas, responsive controls, procedural graphics, and native Web Audio API sound effects.">
  <meta property="og:title" content="Classic Retro Snake">
  <meta property="og:description" content="A polished, modern retro-arcade Snake game built with HTML5 Canvas, responsive controls, procedural graphics, and native Web Audio API sound effects.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* ==========================================================================
       RESET & BASE STYLING
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #080a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    /* Background ambient radial glow */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(6, 78, 59, 0.02) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ==========================================================================
       GAME CONTAINER
       ========================================================================== */
    .game-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 16px;
    }

    /* Header & HUD */
    .hud-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .brand-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #10b981;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-scores {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Courier New', Courier, monospace;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .score-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 20px;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.1;
    }

    .high-score-value {
      color: #38bdf8;
    }

    /* Audio Toggle Button */
    .audio-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .audio-btn:hover {
      background: #1e293b;
      border-color: #10b981;
      color: #f1f5f9;
    }

    /* ==========================================================================
       CANVAS CONTAINER & FRAME
       ========================================================================== */
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0d121c;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8),
                  0 0 20px rgba(16, 185, 129, 0.05);
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Subtle CRT Scanline overlay */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      border-radius: 10px;
    }

    /* ==========================================================================
       CONTROLS FOOTER
       ========================================================================== */
    .controls-hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.5;
    }

    .key-badge {
      display: inline-block;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: monospace;
      margin: 0 1px;
    }

    /* Touch on-screen D-pad for mobile screens */
    .touch-dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
      margin-top: 14px;
    }

    .dpad-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 10px;
      color: #38bdf8;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
    }

    .dpad-btn:active {
      background: rgba(16, 185, 129, 0.4);
      color: #ffffff;
      transform: scale(0.95);
    }

    .dpad-btn.up    { grid-column: 2; grid-row: 1; }
    .dpad-btn.left  { grid-column: 1; grid-row: 2; }
    .dpad-btn.down  { grid-column: 2; grid-row: 2; }
    .dpad-btn.right { grid-column: 3; grid-row: 2; }

    @media (hover: none) and (pointer: coarse) {
      .touch-dpad {
        display: grid;
      }
      .controls-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Top HUD Bar -->
    <header class="hud-header">
      <div class="brand-title">
        <span>SNAKE</span>
      </div>

      <div class="hud-scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span id="scoreDisplay" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">High Score</span>
          <span id="highScoreDisplay" class="score-value high-score-value">0</span>
        </div>
        <button id="soundToggleBtn" class="audio-btn" title="Toggle Sound">
          <span id="soundIcon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Canvas Play Area -->
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="480" height="480"></canvas>
      <div class="scanlines"></div>
    </div>

    <!-- Desktop Controls Instruction -->
    <div class="controls-hint">
      Use <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> or
      <span class="key-badge">↑</span><span class="key-badge">←</span><span class="key-badge">↓</span><span class="key-badge">→</span> to steer &bull;
      <span class="key-badge">Space</span> to restart
    </div>

    <!-- Mobile Virtual Directional Buttons -->
    <div class="touch-dpad">
      <button class="dpad-btn up" id="dpadUp" aria-label="Up">▲</button>
      <button class="dpad-btn left" id="dpadLeft" aria-label="Left">◀</button>
      <button class="dpad-btn down" id="dpadDown" aria-label="Down">▼</button>
      <button class="dpad-btn right" id="dpadRight" aria-label="Right">▶</button>
    </div>
  </div>

  <script>
    /**
     * RETRO CLASSIC SNAKE GAME
     * Completely standalone vanilla JS & HTML5 Canvas implementation
     * - In-memory highScore variable (no localStorage)
     * - Web Audio API synthesized procedural sounds
     * - Anti-reverse protection and input buffering
     * - Touch swipe & D-pad gesture support
     * - Responsive rendering with particle effects
     */

    // --- SOUND ENGINE (Web Audio API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playEatBeep() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // Pleasant ascending frequency ping
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.08); // A5

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.09);
      }

      playGameOverSound() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const duration = 0.35;

        // Low pitch thud
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + duration);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration);

        // Low noise crunch
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.2);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.05));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.setValueAtTime(400, now);
        noiseFilter.frequency.linearRampToValueAtTime(60, now + 0.2);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.25, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);

        noise.start(now);
      }
    }

    // --- GAME ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const canvasContainer = document.getElementById('canvasContainer');

    const sound = new SoundEffects();

    // Grid configuration: 20 x 20 cells
    const GRID_SIZE = 20;
    const CANVAS_SIZE = 480;
    const CELL_SIZE = CANVAS_SIZE / GRID_SIZE; // 24px per cell

    // Game States
    const STATES = {
      READY: 'READY',
      PLAYING: 'PLAYING',
      GAME_OVER: 'GAME_OVER'
    };

    // In-memory high score variable (strictly in-memory, NO localStorage)
    let highScore = 0;

    // Game state container
    const game = {
      state: STATES.READY,
      score: 0,
      snake: [],
      direction: { x: 1, y: 0 }, // Initial move right
      inputQueue: [],            // Direction input buffer to prevent missed turns
      food: { x: 14, y: 10 },
      tickInterval: 140,         // Base speed in milliseconds
      lastTickTime: 0,
      particles: [],
      shakeAmount: 0,
      animTime: 0
    };

    // --- PARTICLES FOR EAT BURSTS ---
    function spawnFoodParticles(x, y) {
      const px = (x + 0.5) * CELL_SIZE;
      const py = (y + 0.5) * CELL_SIZE;
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.0;
        game.particles.push({
          x: px,
          y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 3,
          color: Math.random() < 0.5 ? '#f43f5e' : '#fbbf24',
          alpha: 1.0,
          decay: 0.03 + Math.random() * 0.04
        });
      }
    }

    // --- INITIALIZE & RESET GAME ---
    function initGame() {
      game.score = 0;
      updateScoreUI();

      // Snake starts in center with length 3, moving Right
      const midY = Math.floor(GRID_SIZE / 2);
      const startX = 6;
      game.snake = [
        { x: startX + 2, y: midY }, // Head
        { x: startX + 1, y: midY },
        { x: startX, y: midY }      // Tail
      ];

      game.direction = { x: 1, y: 0 };
      game.inputQueue = [];
      game.tickInterval = 140;
      game.particles = [];
      game.shakeAmount = 0;

      spawnFood();
    }

    function spawnFood() {
      const emptyCells = [];
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const isOccupied = game.snake.some(segment => segment.x === x && segment.y === y);
          if (!isOccupied) {
            emptyCells.push({ x, y });
          }
        }
      }

      if (emptyCells.length > 0) {
        const randomIndex = Math.floor(Math.random() * emptyCells.length);
        game.food = emptyCells[randomIndex];
      }
    }

    function updateScoreUI() {
      scoreDisplay.textContent = game.score;
      if (game.score > highScore) {
        highScore = game.score;
      }
      highScoreDisplay.textContent = highScore;
    }

    // --- INPUT BUFFERING & ANTI-REVERSE LOGIC ---
    function queueDirection(newDir) {
      sound.init(); // Unlock audio on first user gesture

      // If on Start or Game Over screen, pressing a direction or space starts the game
      if (game.state === STATES.READY) {
        game.state = STATES.PLAYING;
      } else if (game.state === STATES.GAME_OVER) {
        initGame();
        game.state = STATES.PLAYING;
        return;
      }

      // Buffer max 2 direction changes ahead of tick
      if (game.inputQueue.length >= 2) return;

      // Determine the reference direction: either the last buffered direction or current active direction
      const lastDir = game.inputQueue.length > 0
        ? game.inputQueue[game.inputQueue.length - 1]
        : game.direction;

      // Anti-reverse check: cannot reverse 180 degrees directly into self
      const isReverse = (newDir.x === -lastDir.x && newDir.y === 0) ||
                        (newDir.y === -lastDir.y && newDir.x === 0);

      // Same direction check: no need to queue duplicate direction
      const isSame = newDir.x === lastDir.x && newDir.y === lastDir.y;

      if (!isReverse && !isSame) {
        game.inputQueue.push(newDir);
      }
    }

    function handleStartOrRestart() {
      sound.init();
      if (game.state === STATES.READY) {
        game.state = STATES.PLAYING;
      } else if (game.state === STATES.GAME_OVER) {
        initGame();
        game.state = STATES.PLAYING;
      }
    }

    // --- EVENT LISTENERS ---
    // 1. Keyboard Controls
    window.addEventListener('keydown', (e) => {
      // Prevent browser scrolling on arrow keys and spacebar
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }

      switch (e.code) {
        case 'ArrowUp':
        case 'KeyW':
          queueDirection({ x: 0, y: -1 });
          break;
        case 'ArrowDown':
        case 'KeyS':
          queueDirection({ x: 0, y: 1 });
          break;
        case 'ArrowLeft':
        case 'KeyA':
          queueDirection({ x: -1, y: 0 });
          break;
        case 'ArrowRight':
        case 'KeyD':
          queueDirection({ x: 1, y: 0 });
          break;
        case 'Space':
        case 'Enter':
          handleStartOrRestart();
          break;
      }
    });

    // 2. Touch Swipe Gestures
    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_THRESHOLD = 24;

    canvasContainer.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    canvasContainer.addEventListener('touchmove', (e) => {
      e.preventDefault(); // Prevent page bouncing / scrolling while swiping on canvas
    }, { passive: false });

    canvasContainer.addEventListener('touchend', (e) => {
      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (Math.max(absDx, absDy) > SWIPE_THRESHOLD) {
        if (absDx > absDy) {
          // Horizontal swipe
          if (dx > 0) queueDirection({ x: 1, y: 0 });
          else queueDirection({ x: -1, y: 0 });
        } else {
          // Vertical swipe
          if (dy > 0) queueDirection({ x: 0, y: 1 });
          else queueDirection({ x: 0, y: -1 });
        }
      } else {
        // Simple tap on canvas starts or restarts
        handleStartOrRestart();
      }
    });

    // Tap/Click on canvas for restart/start
    canvas.addEventListener('click', () => {
      handleStartOrRestart();
    });

    // 3. Virtual D-pad for mobile
    const bindDpad = (id, dir) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      const act = (ev) => {
        ev.preventDefault();
        queueDirection(dir);
      };
      btn.addEventListener('touchstart', act, { passive: false });
      btn.addEventListener('mousedown', act);
    };

    bindDpad('dpadUp', { x: 0, y: -1 });
    bindDpad('dpadDown', { x: 0, y: 1 });
    bindDpad('dpadLeft', { x: -1, y: 0 });
    bindDpad('dpadRight', { x: 1, y: 0 });

    // 4. Audio Toggle Button
    soundToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      const isEnabled = sound.toggle();
      soundIcon.textContent = isEnabled ? '🔊' : '🔇';
    });

    // --- GAME LOOP & STATE TICK ---
    function updateGameTick() {
      // Consume queued direction if available
      if (game.inputQueue.length > 0) {
        game.direction = game.inputQueue.shift();
      }

      const head = game.snake[0];
      const newHead = {
        x: head.x + game.direction.x,
        y: head.y + game.direction.y
      };

      // 1. Collision with Outer Walls
      if (
        newHead.x < 0 || newHead.x >= GRID_SIZE ||
        newHead.y < 0 || newHead.y >= GRID_SIZE
      ) {
        triggerGameOver();
        return;
      }

      // 2. Collision with Snake's Own Body
      const selfCollision = game.snake.some((seg, idx) => {
        // Exclude the tail segment if it is about to move away (unless food is being eaten)
        const isTail = idx === game.snake.length - 1;
        const eatingFood = (newHead.x === game.food.x && newHead.y === game.food.y);
        if (isTail && !eatingFood) return false;
        return seg.x === newHead.x && seg.y === newHead.y;
      });

      if (selfCollision) {
        triggerGameOver();
        return;
      }

      // Move snake: add new head
      game.snake.unshift(newHead);

      // Check if food eaten
      if (newHead.x === game.food.x && newHead.y === game.food.y) {
        game.score++;
        updateScoreUI();
        sound.playEatBeep();
        spawnFoodParticles(newHead.x, newHead.y);

        // Dynamic difficulty: gradually accelerate tick speed as score climbs
        game.tickInterval = Math.max(65, 140 - Math.floor(game.score / 2) * 5);

        spawnFood();
      } else {
        // Remove tail
        game.snake.pop();
      }
    }

    function triggerGameOver() {
      game.state = STATES.GAME_OVER;
      game.shakeAmount = 8;
      sound.playGameOverSound();
      updateScoreUI();
    }

    // --- RENDERING ROUTINES ---
    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = i * CELL_SIZE;
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, CANVAS_SIZE);
        ctx.moveTo(0, pos);
        ctx.lineTo(CANVAS_SIZE, pos);
      }
      ctx.stroke();
    }

    function drawFood(time) {
      const fx = (game.food.x + 0.5) * CELL_SIZE;
      const fy = (game.food.y + 0.5) * CELL_SIZE;

      // Gentle pulsing animation
      const pulse = Math.sin(time * 0.006) * 1.5;
      const radius = (CELL_SIZE * 0.38) + pulse;

      // Glow effect
      ctx.save();
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 12 + Math.sin(time * 0.008) * 4;

      // Outer radial glow
      const grad = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, radius + 2);
      grad.addColorStop(0, '#fda4af');
      grad.addColorStop(0.4, '#f43f5e');
      grad.addColorStop(1, '#e11d48');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fx, fy, radius, 0, Math.PI * 2);
      ctx.fill();

      // Cute stem/highlight
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(fx - radius * 0.3, fy - radius * 0.3, radius * 0.22, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSnake() {
      const len = game.snake.length;
      if (len === 0) return;

      // Draw body segments (from tail to head)
      for (let i = len - 1; i >= 0; i--) {
        const seg = game.snake[i];
        const cx = seg.x * CELL_SIZE;
        const cy = seg.y * CELL_SIZE;
        const pad = 1.5;
        const segSize = CELL_SIZE - pad * 2;
        const radius = Math.floor(CELL_SIZE * 0.35);

        ctx.save();

        if (i === 0) {
          // --- HEAD SEGMENT ---
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#34d399';

          // Rounded head rect
          ctx.beginPath();
          ctx.roundRect(cx + pad, cy + pad, segSize, segSize, radius + 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Render directional eyes
          const eyeOffset = CELL_SIZE * 0.26;
          const eyeRadius = CELL_SIZE * 0.12;
          const pupilRadius = CELL_SIZE * 0.06;

          let eye1 = { x: 0, y: 0 };
          let eye2 = { x: 0, y: 0 };
          let pupilShift = { x: 0, y: 0 };

          const midX = cx + CELL_SIZE / 2;
          const midY = cy + CELL_SIZE / 2;

          if (game.direction.x === 1) { // Moving Right
            eye1 = { x: midX + 3, y: midY - eyeOffset };
            eye2 = { x: midX + 3, y: midY + eyeOffset };
            pupilShift = { x: 1.5, y: 0 };
          } else if (game.direction.x === -1) { // Moving Left
            eye1 = { x: midX - 3, y: midY - eyeOffset };
            eye2 = { x: midX - 3, y: midY + eyeOffset };
            pupilShift = { x: -1.5, y: 0 };
          } else if (game.direction.y === -1) { // Moving Up
            eye1 = { x: midX - eyeOffset, y: midY - 3 };
            eye2 = { x: midX + eyeOffset, y: midY - 3 };
            pupilShift = { x: 0, y: -1.5 };
          } else { // Moving Down
            eye1 = { x: midX - eyeOffset, y: midY + 3 };
            eye2 = { x: midX + eyeOffset, y: midY + 3 };
            pupilShift = { x: 0, y: 1.5 };
          }

          // Eye whites
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2);
          ctx.fill();

          // Pupils
          ctx.fillStyle = '#064e3b';
          ctx.beginPath();
          ctx.arc(eye1.x + pupilShift.x, eye1.y + pupilShift.y, pupilRadius, 0, Math.PI * 2);
          ctx.arc(eye2.x + pupilShift.x, eye2.y + pupilShift.y, pupilRadius, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // --- BODY SEGMENTS ---
          // Smooth color gradient from head (bright emerald) to tail (deep forest jade)
          const factor = i / len;
          const r = Math.round(16 + factor * (5 - 16));
          const g = Math.round(185 + factor * (120 - 185));
          const b = Math.round(129 + factor * (80 - 129));
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

          ctx.beginPath();
          ctx.roundRect(cx + pad, cy + pad, segSize, segSize, radius);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function drawParticles() {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          game.particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawOverlays(time) {
      if (game.state === STATES.READY) {
        // Semi-transparent backdrop
        ctx.fillStyle = 'rgba(13, 18, 28, 0.88)';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        ctx.textAlign = 'center';

        // Title Logo
        ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 16;
        ctx.fillText('RETRO SNAKE', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 45);
        ctx.shadowBlur = 0;

        ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Classic arcade gameplay with dynamic speed', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 12);

        // Blinking Call to Action
        if (Math.floor(time / 450) % 2 === 0) {
          ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 8;
          ctx.fillText('PRESS ANY ARROW OR SWIPE TO PLAY', CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 55);
          ctx.shadowBlur = 0;
        }

        // Sub prompt
        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#64748b';
        ctx.fillText('Touch screen or click to start immediately', CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 85);
      }

      else if (game.state === STATES.GAME_OVER) {
        ctx.fillStyle = 'rgba(13, 18, 28, 0.88)';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        ctx.textAlign = 'center';

        // Game Over Banner
        ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 14;
        ctx.fillText('GAME OVER', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 60);
        ctx.shadowBlur = 0;

        // Scores Box
        ctx.font = '600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#f1f5f9';
        ctx.fillText(`SCORE: ${game.score}`, CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 15);

        ctx.font = '600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`SESSION BEST: ${highScore}`, CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 15);

        // Interactive Restart Button styling
        const btnW = 160;
        const btnH = 42;
        const btnX = (CANVAS_SIZE - btnW) / 2;
        const btnY = CANVAS_SIZE / 2 + 50;

        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 8);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.font = '700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#064e3b';
        ctx.fillText('PLAY AGAIN', CANVAS_SIZE / 2, btnY + 26);

        // Key hint
        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace';
        ctx.fillStyle = '#64748b';
        ctx.fillText('Press [SPACE] or tap anywhere to restart', CANVAS_SIZE / 2, btnY + 68);
      }
    }

    // --- MAIN ANIMATION & TICK DISPATCHER ---
    function render(time) {
      game.animTime = time;

      // Handle Game Logic Tick based on dynamic tickInterval
      if (game.state === STATES.PLAYING) {
        if (time - game.lastTickTime >= game.tickInterval) {
          game.lastTickTime = time;
          updateGameTick();
        }
      }

      // Clear canvas with background
      ctx.save();

      // Screen shake decay
      if (game.shakeAmount > 0) {
        const sx = (Math.random() - 0.5) * game.shakeAmount;
        const sy = (Math.random() - 0.5) * game.shakeAmount;
        ctx.translate(sx, sy);
        game.shakeAmount *= 0.85;
        if (game.shakeAmount < 0.2) game.shakeAmount = 0;
      }

      ctx.fillStyle = '#0d121c';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // Draw subtle grid
      drawGrid();

      // Draw Food & Snake
      drawFood(time);
      drawSnake();

      // Draw Eat Sparks
      drawParticles();

      // Draw Overlays (Ready or Game Over)
      drawOverlays(time);

      ctx.restore();

      requestAnimationFrame(render);
    }

    // Bootstrap
    initGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
